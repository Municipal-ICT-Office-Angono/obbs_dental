[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

# Reverse proxy support (Gateway -> Dokploy Traefik -> Odoo)
# Honors X-Forwarded-For, X-Forwarded-Proto, and X-Forwarded-Host
proxy_mode = True

# Disable public database selector and manager in production for security
list_db = False

# Worker & process concurrency (adjust based on host CPU cores: 2 * CPU + 1)
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

# Logging
log_level = info
