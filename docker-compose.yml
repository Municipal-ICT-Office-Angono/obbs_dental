services:
  db:
    image: postgres:16
    container_name: obbs_dental_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:19
    container_name: obbs_dental_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons/obbs_dental:ro
      - odoo_data:/var/lib/odoo
    # admin_passwd defaults to "admin" in Odoo 19 (config-file only option,
    # not settable via CLI). Login: admin / admin
    command:
      - odoo
      - --db-filter=obbs_dental_demo
      - --log-level=info

volumes:
  db_data:
  odoo_data: